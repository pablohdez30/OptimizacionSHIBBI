<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Shibbi — Presupuesto a medida</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --background:  #FAFAFA;
    --surface:     #FFFFFF;
    --text:        #1D1D1F;
    --text-muted:  #6E6E73;
    --border:      #D2D2D7;
    --border-soft: #E8E8ED;
    --accent:      #1D1D1F;
    --accent-bg:   #F5F5F7;
    --error:       #B42318;
    --success:     #027A48;

    --display: "Fraunces", Georgia, serif;
    --sans: "Inter Tight", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;

    --section-spacing: 128px;
    --container-max: 1440px;
    --side-pad: 64px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--background);
    color: var(--text);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  body { overflow-x: hidden; }

  ::selection { background: var(--text); color: var(--background); }

  button { font-family: inherit; cursor: pointer; border: 0; background: none; color: inherit; }
  input, textarea { font-family: inherit; color: inherit; }
  a { color: inherit; text-decoration: none; }

  /* Focus ring */
  :focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  button:focus:not(:focus-visible), input:focus:not(:focus-visible) { outline: none; }

  /* Utility */
  .eyebrow {
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
  }
  .mono { font-family: var(--mono); font-feature-settings: "tnum"; }
  .display { font-family: var(--display); font-weight: 300; letter-spacing: -0.02em; }
  .muted { color: var(--text-muted); }

  /* Reduced motion */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>

<script type="application/json" id="tweaks-defaults">
  /*EDITMODE-BEGIN*/{
    "displayFont": "Fraunces",
    "density": "spacious",
    "panelLayout": "right-sticky",
    "heroVariant": "type-only",
    "showProgress": true
  }/*EDITMODE-END*/
</script>
</head>

<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="src/data.jsx"></script>
  <script type="text/babel" src="src/primitives.jsx"></script>
  <script type="text/babel" src="src/sections.jsx"></script>
  <script type="text/babel" src="src/price-panel.jsx"></script>
  <script type="text/babel" src="src/app.jsx"></script>
</body>
</html>
